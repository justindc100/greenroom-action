# Greenroom's reusable release-pass workflow. Customers call this from their
# own workflow with `uses: justindc100/greenroom-action/.github/workflows/pass.yml@<sha>`.
#
# Why a reusable workflow: the control plane trusts a run by the OIDC token's
# job_workflow_ref / job_workflow_sha, and for a job defined in the customer's
# own repository those claims change with every pull request. When the job is
# defined here, the claims name THIS file at the pinned commit, which Greenroom
# publishes as a trusted workflow (packages/production/config/trusted-workflows.json).
# A pull request cannot change what this job does, so the policy read from the
# base revision below really is the policy that ran.
#
# Published copies live in the public action repository (.github/workflows/pass.yml);
# the source of truth is packages/runner/workflows/pass.yml in the private repo.
name: Greenroom pass

on:
  workflow_call:
    inputs:
      platform:
        description: web or ios
        type: string
        default: web
      app-id:
        description: Stable Greenroom app slug for this repository
        type: string
        required: true
      prepare:
        description: Shell to build and serve the preview before the pass (background the server with &)
        type: string
        default: ""
      target-url:
        description: Web preview URL the pass walks (its host must be in the manifest allowlist)
        type: string
        default: ""
      artifact-path:
        description: Directory (web) or .app bundle (iOS) whose content digest attests the build
        type: string
        default: "."
      artifact-name:
        description: Name of a workflow artifact (from a separate secretless build job) to download to artifact-path before the pass
        type: string
        default: ""
      app:
        description: iOS bundle identifier
        type: string
        default: ""
      device:
        description: Exact iOS Simulator name or UDID
        type: string
        default: ""
      ios-warm:
        description: >-
          Experimental, opt in ("true"): before the artifact download and your prepare script, find or create the
          simulator named by `device`, boot it, and compile Greenroom's XCTest runner while it boots (the UDID reaches
          your prepare step as GREENROOM_SIMULATOR_UDID). Off by default: the job then prepares the way runner 0.3.13
          did, the simulator booted by your prepare script or by the pass and the XCTest runner built at first use.
          The two hosted attempts that used the warm-up (2026-09-09) shortened the prepare step to 123 s and 104 s of
          600 s but lost the app session when agent-device restarted its XCTest runner mid-walk
          (docs/canaries/attempts/release-0314-2026-09-09.json, release-0315-2026-09-09.json).
        type: string
        default: "false"
      ios-warm-stop-daemon:
        description: >-
          Only with ios-warm "true". Opt in ("true") to stop the warm-up's agent-device daemon and release its XCTest
          runner before your prepare script runs. Only for a prepare script that drives agent-device under its own
          AGENT_DEVICE_STATE_DIR (it would otherwise be told the runner is owned by another daemon); the pass then
          starts the runner again. Default: the warmed daemon and runner stay up in the default state directory for
          your prepare and the pass to reuse.
        type: string
        default: "false"
      goal:
        description: Bounded validation goal
        type: string
        default: ""
      allowed-hosts:
        description: Comma-separated network allowlist override
        type: string
        default: ""
      environment-manifest:
        description: Path (in the repository) of the environment attestation, read from the PR base revision
        type: string
        default: .greenroom/environment.json
      state-contract:
        description: Path (in the repository) of the route-state contract, read from the PR base revision
        type: string
        default: .greenroom/state-contract.json
      greenroom-api-url:
        type: string
        default: https://app.getgreenroom.io
      runs-on:
        description: Runner label (ubuntu-latest for web, macos-15 for iOS)
        type: string
        default: ubuntu-latest
      source-upload-allowed:
        description: Include bounded patches and a source index (server policy must also allow it)
        type: string
        default: "false"
      fail-on-infra-error:
        type: string
        default: "false"
      release-canary:
        description: Internal release gate; wait for independent verification and Check delivery
        type: string
        default: "false"
    secrets:
      session:
        description: >-
          Session payload for an app that starts signed in (environment manifest auth.mechanism session_import):
          the JSON object the authenticated-apps guide describes, from the repository secret the manifest names.
          Leave it unset for a signed_out manifest.
        required: false
    outputs:
      run-id:
        value: ${{ jobs.pass.outputs.run-id }}
      report-url:
        value: ${{ jobs.pass.outputs.report-url }}
      runner-verdict:
        value: ${{ jobs.pass.outputs.runner-verdict }}
      release-gate:
        value: ${{ jobs.pass.outputs.release-gate }}

permissions:
  contents: read

jobs:
  pass:
    name: Greenroom pass
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      run-id: ${{ steps.greenroom.outputs.run-id }}
      report-url: ${{ steps.greenroom.outputs.report-url }}
      runner-verdict: ${{ steps.greenroom.outputs.runner-verdict }}
      release-gate: ${{ steps.greenroom.outputs.release-gate }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false

      # GitHub exposes the called workflow identity on job.*, not github.*.
      # Reject missing identity before checkout can fall back to mutable main.
      - name: Require the reusable workflow identity
        id: runner-identity
        shell: bash
        env:
          GREENROOM_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          GREENROOM_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          GREENROOM_JOB_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          test "$GREENROOM_JOB_WORKFLOW_REPOSITORY" = justindc100/greenroom-action
          test "$GREENROOM_JOB_WORKFLOW_PATH" = .github/workflows/pass.yml
          if [[ ! "$GREENROOM_JOB_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Missing or invalid reusable workflow SHA" >&2
            exit 1
          fi
          echo "sha=$GREENROOM_JOB_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      # The runner is fetched at this workflow file's own commit, so the code
      # that runs is exactly the code the trusted workflow SHA names.
      - name: Fetch the Greenroom runner at this workflow's commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          repository: justindc100/greenroom-action
          ref: ${{ steps.runner-identity.outputs.sha }}
          path: .greenroom-action
          persist-credentials: false

      - name: Verify the fetched runner revision
        shell: bash
        env:
          GREENROOM_EXPECTED_RUNNER_SHA: ${{ steps.runner-identity.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C .greenroom-action rev-parse HEAD)" = "$GREENROOM_EXPECTED_RUNNER_SHA"

      # The event's pull_request.base.sha is the base commit GitHub last recorded
      # on the pull request, which lags the base branch until the PR is next
      # synchronized: a policy change merged to main is invisible to a PR's
      # next run until then, and the diff against that stale base lists files
      # main already has. The base branch's current tip is the trusted policy
      # revision; the event's sha is only the fallback when the fetch fails.
      - name: Materialize Greenroom policy from the trusted base revision
        id: policy
        shell: bash
        env:
          GREENROOM_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GREENROOM_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GREENROOM_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANIFEST_PATH: ${{ inputs.environment-manifest }}
          CONTRACT_PATH: ${{ inputs.state-contract }}
        run: |
          set -euo pipefail
          # Policy comes from the base branch's tip; the diff the runner scopes
          # from starts at the merge base of that tip and the PR head, so a PR
          # that has not merged the latest base is not blamed for the base's own
          # changes. Both fall back to the event's base sha.
          GREENROOM_BASE_SHA="${GREENROOM_EVENT_BASE_SHA}"
          GREENROOM_DIFF_BASE="${GREENROOM_EVENT_BASE_SHA}"
          if [ -n "${GREENROOM_BASE_REF}" ] && git fetch --no-tags origin "refs/heads/${GREENROOM_BASE_REF}" 2>/dev/null; then
            GREENROOM_BASE_SHA="$(git rev-parse FETCH_HEAD)"
            GREENROOM_DIFF_BASE="$(git merge-base FETCH_HEAD "${GREENROOM_HEAD_SHA}" 2>/dev/null || echo "${GREENROOM_BASE_SHA}")"
          fi
          echo "policy-sha=${GREENROOM_BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "base-sha=${GREENROOM_DIFF_BASE}" >> "$GITHUB_OUTPUT"
          echo "Policy revision: ${GREENROOM_BASE_SHA} (base branch ${GREENROOM_BASE_REF:-unknown}; event base ${GREENROOM_EVENT_BASE_SHA}); diff base: ${GREENROOM_DIFF_BASE}"
          git show "${GREENROOM_BASE_SHA}:${MANIFEST_PATH}" > "${RUNNER_TEMP}/greenroom-environment.json"
          echo "manifest=${RUNNER_TEMP}/greenroom-environment.json" >> "$GITHUB_OUTPUT"
          if git cat-file -e "${GREENROOM_BASE_SHA}:${CONTRACT_PATH}" 2>/dev/null; then
            git show "${GREENROOM_BASE_SHA}:${CONTRACT_PATH}" > "${RUNNER_TEMP}/greenroom-state-contract.json"
            echo "contract=${RUNNER_TEMP}/greenroom-state-contract.json" >> "$GITHUB_OUTPUT"
          else
            echo "No ${CONTRACT_PATH} at the base revision; coverage authority stays requested-goal-only."
            echo "contract=" >> "$GITHUB_OUTPUT"
          fi

      # Spotlight indexing off on a GitHub-hosted Mac before any simulator
      # boots (the warm-up below, the customer's prepare script, or the pass's
      # own preparation). The three no-model host smokes of 2026-09-09 on the
      # macos-26 image (GR-12; fixture-repository Actions 34408902477,
      # 34410772878 and 34412523322) sampled the ten busiest processes on the
      # 3-vCPU / 7 GiB VirtualMac2,1 hosts: the image's Spotlight indexer
      # (`mds`, `mds_stores`, four to six `mdworker_shared` at 9-29 % each,
      # several "stuck") was saturating the CPU as each job started, with a
      # 1-minute load of 85 to 212, and the first display capture after
      # `open` took 6 to 15 s in every run, the prelude of the 0.3.16
      # canary's watchdog failure. `mdutil -a -i off` stops indexing on every
      # volume; the host is ephemeral and nothing depends on its index.
      # Passwordless sudo is part of GitHub's hosted macOS images; on a
      # self-hosted runner this step is skipped (runner.environment), so a
      # customer's own Mac keeps its Spotlight. A failure here is a warning,
      # never a failed job.
      - name: Turn Spotlight indexing off on the hosted Mac
        if: inputs.platform == 'ios' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          set +e
          if sudo mdutil -a -i off; then echo "Spotlight indexing off on every volume."; else echo "::warning::sudo mdutil -a -i off failed (exit $?); the host keeps indexing"; fi
          sudo mdutil -a -s 2>/dev/null | head -20
          exit 0

      # Opt-in iOS preparation warm-up (input ios-warm, off by default),
      # before the artifact download and the customer's prepare: find or
      # create the simulator named by `device`, boot it, and compile
      # agent-device's XCTest runner while it boots. A cold macos-26 host
      # spends 150-395 s on first boot and 118-165 s on that build
      # (docs/pilots/suelto, docs/canaries, 2026-09-06); in parallel they cost
      # the larger of the two, not the sum. The warm-up's agent-device daemon
      # and the XCTest runner it started and health-checked stay running in
      # the default state directory, so the prepare script's and the runner's
      # own `prepare ios-runner` reuse that runner instead of starting another
      # (lib/ios-warm.js; 0.3.14 stopped it and re-prepared for 72 s). The
      # simulator's UDID is exported as GREENROOM_SIMULATOR_UDID for the
      # prepare script; a script that creates the device itself must reuse
      # this one instead. A boot that does not finish within 10 minutes fails
      # here, before a run is minted, with the reason named.
      #
      # Off by default since 0.3.16: on both hosted canaries that ran it
      # (0.3.14 and 0.3.15, 2026-09-09) the prepare step shrank to 123 s and
      # 104 s of 600 s, but agent-device's daemon then interrupted and
      # restarted its XCTest runner mid-walk on the hosted Mac and the app
      # session did not survive (docs/canaries/attempts/release-0314-2026-09-09.json,
      # release-0315-2026-09-09.json); an idle Mac does not reproduce it.
      # When the input is not "true" this step is skipped and the job prepares
      # exactly as runner 0.3.13 did: the prepare script (or the pass itself,
      # lib/ios-artifact.js, bootstatus bound 600 s) boots the simulator and
      # the XCTest runner is built at the pass's first use.
      - name: Warm the iOS simulator and XCTest runner
        if: inputs.platform == 'ios' && inputs.device != '' && inputs.ios-warm == 'true'
        shell: bash
        env:
          GREENROOM_DEVICE: ${{ inputs.device }}
          GREENROOM_IOS_WARM_STOP_DAEMON: ${{ inputs.ios-warm-stop-daemon }}
        run: node .greenroom-action/dist/index.js warm-ios --device "$GREENROOM_DEVICE" --receipt "$RUNNER_TEMP/greenroom-ios-warm.json" --stop-daemon "$GREENROOM_IOS_WARM_STOP_DAEMON"

      # Two-job split: a separate build job (no secrets, no Greenroom identity)
      # uploads the simulator .app or the built preview, and this job only
      # downloads it. See the CI workflow reference.
      - name: Download the build artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - name: Prepare the preview
        if: inputs.prepare != ''
        shell: bash
        run: ${{ inputs.prepare }}

      # A content digest of the built artifact attests what was walked. For a
      # static web preview this is the served directory; for iOS the .app.
      - name: Digest the build artifact
        # iOS is hashed by the runner's Node implementation. This GNU tar
        # command is for the Linux web job only; macOS ships BSD tar.
        if: inputs.platform == 'web'
        id: digest
        shell: bash
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          set -euo pipefail
          if [ ! -e "$ARTIFACT_PATH" ]; then echo "artifact-path ${ARTIFACT_PATH} does not exist" >&2; exit 1; fi
          digest=$(tar --exclude=.git --exclude=.greenroom-action --exclude=node_modules --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "$ARTIFACT_PATH" | sha256sum | cut -d' ' -f1)
          echo "sha256=${digest}" >> "$GITHUB_OUTPUT"

      - name: Greenroom release pass
        id: greenroom
        uses: ./.greenroom-action
        # The session payload reaches the runner as one environment variable
        # (packages/runner/lib/session-import.js SESSION_ENV), never as an
        # input, an argument or a shell; GitHub masks the secret in the log.
        env:
          GREENROOM_SESSION: ${{ secrets.session }}
        with:
          greenroom-api-url: ${{ inputs.greenroom-api-url }}
          platform: ${{ inputs.platform }}
          target-url: ${{ inputs.target-url }}
          artifact: ${{ inputs.platform == 'ios' && inputs.artifact-path || '' }}
          artifact-digest: ${{ inputs.platform == 'web' && steps.digest.outputs.sha256 || '' }}
          app: ${{ inputs.app }}
          device: ${{ inputs.device }}
          app-id: ${{ inputs.app-id }}
          goal: ${{ inputs.goal }}
          allowed-hosts: ${{ inputs.allowed-hosts }}
          environment-manifest: ${{ steps.policy.outputs.manifest }}
          state-contract: ${{ steps.policy.outputs.contract }}
          base-sha: ${{ steps.policy.outputs.base-sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          pull-request-number: ${{ github.event.pull_request.number }}
          # Dashboard labels only. Both reach the runner as INPUT_* environment
          # variables (never a shell), so an adversarial PR title cannot inject.
          pull-request-title: ${{ github.event.pull_request.title }}
          head-ref: ${{ github.head_ref }}
          source-upload-allowed: ${{ inputs.source-upload-allowed }}
          fail-on-infra-error: ${{ inputs.fail-on-infra-error }}
          release-canary: ${{ inputs.release-canary }}

      # When an iOS job fails, keep agent-device's own diagnostics from the
      # ephemeral host: the XCTest runner's build/start output (runner.log),
      # the daemon's per-request logs and event stream for each sim-<udid>
      # session, the daemon log, and, when ios-warm ran, the warm-up receipt
      # (plus the private state directory when ios-warm-stop-daemon was used).
      # They hold session
      # names, simulator UDIDs, xcodebuild output and the runner's command
      # requests and responses for the session, which are the accessibility
      # snapshots the pass already uploads as run evidence; no secrets and no
      # customer app content beyond what those logs already hold. The 0.3.14
      # iOS canary failed with a bare "Command failed" line and none of this
      # (docs/canaries/attempts/release-0314-2026-09-09.json).
      - name: Upload agent-device session logs
        if: failure() && inputs.platform == 'ios'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: greenroom-agent-device-logs-${{ inputs.app-id }}-${{ github.run_attempt }}
          path: |
            ~/.agent-device/sessions/sim-*/runner.log
            ~/.agent-device/sessions/sim-*/requests/
            ~/.agent-device/sessions/sim-*/events.ndjson
            ~/.agent-device/daemon.log
            ${{ runner.temp }}/greenroom-ios-warm.json
            ${{ runner.temp }}/greenroom-ios-warm-*/
          if-no-files-found: warn
          retention-days: 14
